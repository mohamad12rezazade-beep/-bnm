      - name: Check Secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$BOT_TOKEN" || (echo "BOT_TOKEN is missing" && exit 1)
          test -n "$DATABASE_URL" || (echo "DATABASE_URL is missing" && exit 1)
          echo "Both secrets are configured."
